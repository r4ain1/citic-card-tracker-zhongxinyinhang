# =======================================================
# 中信银行信用卡账单汇总与活动消费达标监控配置文件
# =======================================================

general:
  default_end_day: 20
  browser:
    user_data_dir: "./chrome_profile"
    headless: false
    remote_debugging_port: null

# -------------------------------------------------------
# 活动消费达标监控规则列表
# -------------------------------------------------------
campaigns:
  # 规则 1: 净支出超过 6000 元
  - id: "cmp_net_spend_6k"
    name: "月度全渠道净支出达标 (6000元)"
    target_amount: 6000.0
    channels: []                   # 留空表示全渠道
    keywords: []                   # 留空表示不限关键字
    cards: []                      # 留空表示所有卡
    min_single_amount: 0.0
    description: "当月累计净支出（总消费支出 - 商户退款）达到 6,000 元"

  # 规则 2: 美团相关支出达到 2000 元以上
  - id: "cmp_meituan_2k"
    name: "美团相关消费达标 (2000元)"
    target_amount: 2000.0
    channels: ["美团"]
    keywords: ["美团", "大众点评", "三快", "汉海"] # 涵盖美团支付以及微信/支付宝的美团商户
    cards: []
    min_single_amount: 0.0
    description: "美团及大众点评（含美团支付渠道及微信美团小程序消费）累计净消费满 2,000 元"

  # 规则 3: 抖音相关消费监控
  - id: "cmp_douyin_monitor"
    name: "抖音相关消费监控"
    target_amount: 300.0
    channels: ["内容电商/直播"]
    keywords: ["抖音", "字节"]
    cards: []
    min_single_amount: 0.0
    description: "抖音支付及字节系平台累计净消费支出监控"
